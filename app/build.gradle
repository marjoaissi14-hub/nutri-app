plugins {
    id 'com.android.application'
}

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.marjoaissi.nutri'
    compileSdk 35

    defaultConfig {
        applicationId 'com.marjoaissi.nutri'
        minSdk 24
        targetSdk 35
        versionCode run
        versionName "1.0.${run}"
    }

    signingConfigs {
        // Clé fixe : les mises à jour s'installent par-dessus, sans désinstaller.
        nutri {
            storeFile file('nutri.keystore')
            storePassword 'nutri-app-2026'
            keyAlias 'nutri'
            keyPassword 'nutri-app-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.nutri
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
