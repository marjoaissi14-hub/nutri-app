plugins {
    id 'com.android.application'
}

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.marjoaissi.nutri'
    compileSdk 35

    defaultConfig {
        applicationId 'com.marjoaissi.nutri'
        minSdk 24
        targetSdk 35
        versionCode run
        versionName "1.0.${run}"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Pas de Play Store : on signe avec la clé de débogage générée par GitHub.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
